name: Backend CI

on:
  push:
    branches: [ "main", "dev" ] # 팀의 메인 브랜치명을 여기에 적어주세요.
  pull_request:
    branches: [ "main", "dev" ] # PR을 올릴 때 발동합니다.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Setup Gradle (Cache)
        uses: gradle/actions/setup-gradle@v3
        
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Tests (Including ArchUnit)
        # 이 명령어가 실패하면(ArchUnit 위반 등) PR이 블락됩니다.
        run: ./gradlew test
