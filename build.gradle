plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.diffplug.spotless'
}

group = 'com.sparta'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring MVC
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Bcrypt
    implementation "org.mindrot:jbcrypt:${jBcrpytVersion}"

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // JPA & MySQL
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    runtimeOnly 'com.mysql:mysql-connector-j'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Jackson for Redis
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Logging & Monitoring
    // implementation "io.sentry:sentry-logback:${property("sentryVersion")}" TODO Sentry는 계정 협의 후 연동 예정
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Firebase Admin SDK
    implementation "com.google.firebase:firebase-admin:${firebaseAdminSDKVersion}"

    // S3 (AWS SDK v2 via awspring) - 3.4.x는 Spring Boot 3.5.x 공식 호환 버전
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.4.2'

    // flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // dotenv
//    implementation("io.github.cdimascio:dotenv-java:3.0.0")
    implementation("me.paulschwarz:spring-dotenv:4.0.0")

    // 기상청 API
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    testImplementation 'com.h2database:h2'

    // Google Cloud Vision API
    implementation 'com.google.cloud:google-cloud-vision:3.92.0'
    
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
}

def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDir querydslDir
}

configurations {
    querydsl.extendsFrom compileClasspath
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = file(querydslDir)
}

clean {
    delete file(querydslDir)
}

tasks.named('test') {
    useJUnitPlatform()
    environment "AWS_REGION", "ap-northeast-2"
    environment "AWS_S3_ACCESS_KEY", "dummy"
    environment "AWS_S3_SECRET_KEY", "dummy"
    environment "AWS_S3_BUCKET_NAME", "dummy-bucket"
}

// Firebase 키 파일을 리소스로 포함하기 위한 설정
processResources {
    from('firebase-key.json') {
        into '.'
    }
}
