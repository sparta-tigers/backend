cloud:
  aws:
    credentials:
      access-key : ${AWS_S3_ACCESS_KEY}
      secret-key : ${AWS_S3_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
      folders:
        team-symbol: team-symbols/
      upload:
        max-size: 5242880
        allowed-extensions:
          - jpg
          - jpeg
          - png
    stack:
      auto: false