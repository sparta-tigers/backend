spring.config.activate.on-profile: local

jwt:
  access-token:
    secret: ${JWT_LOCAL_ACCESS_TOKEN_SECRET}
    # 7일
    expire: 604800000
  refresh-token:
    secret: ${JWT_LOCAL_REFRESH_TOKEN_SECRET}
    # 7일
    expire: 604800000

---
spring.config.activate.on-profile: prod

jwt:
  access-token:
    secret: ${JWT_PROD_ACCESS_TOKEN_SECRET}
    # 1시간
    expire: 3600000
  refresh-token:
    secret: ${JWT_PROD_REFRESH_TOKEN_SECRET}
    # 7일
    expire: 604800000