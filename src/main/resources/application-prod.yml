# ===========================================
# Spring Boot Setting for 'prod' profile
# ===========================================

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATABASE_PROD_URL}:${DATABASE_PROD_PORT}/${DATABASE_PROD_SCHEMA}
    username: ${DATABASE_PROD_USERNAME}
    password: ${DATABASE_PROD_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_PROD_URL}
      port: ${REDIS_PROD_PORT}
      password: ${REDIS_PROD_PASSWORD}
      timeout: 3000

# ===========================================
# JWT Settings
# ===========================================
jwt:
  access-token:
    secret: ${JWT_PROD_ACCESS_TOKEN_SECRET}
    expire: 3600000 # 1시간
  refresh-token:
    secret: ${JWT_PROD_REFRESH_TOKEN_SECRET}
    expire: 604800000 # 7일

# ===========================================
# Notification Settings (Discord)
# ===========================================
discord:
  webhook-url: ${DISCORD_WEBHOOK_PROD_URL}

# ===========================================
# Firebase Settings (Production)
# ===========================================
firebase:
  project-id: "sparta-33b05"
  # 운영 환경: JAR 내부 리소스 사용 (클래스패스)
  credentials-path: "firebase-key.json"